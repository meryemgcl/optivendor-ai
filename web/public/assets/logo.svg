<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="optiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="240" rx="24" fill="#090D16" />
  <path d="M 0 60 L 800 60 M 0 120 L 800 120 M 0 180 L 800 180" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M 200 0 L 200 240 M 400 0 L 400 240 M 600 0 L 600 240" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.4"/>

  <g transform="translate(60, 40)">
    <circle cx="80" cy="80" r="65" fill="url(#glowGrad)" filter="url(#neonGlow)" opacity="0.25"/>
    <path d="M 80 20 L 132 50 L 132 110 L 80 140 L 28 110 L 28 50 Z" fill="none" stroke="url(#optiGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="80,45 110,65 110,95 80,115 50,95 50,65" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="80" cy="80" r="14" fill="url(#optiGrad)" filter="url(#neonGlow)" />
    <circle cx="80" cy="80" r="6" fill="#FFFFFF" />
    <circle cx="80" cy="20" r="5" fill="#60A5FA" />
    <circle cx="132" cy="50" r="5" fill="#818CF8" />
    <circle cx="132" cy="110" r="5" fill="#34D399" />
    <circle cx="80" cy="140" r="5" fill="#10B981" />
    <circle cx="28" cy="110" r="5" fill="#38BDF8" />
    <circle cx="28" cy="50" r="5" fill="#6366F1" />
    <path d="M 68 80 L 76 88 L 94 70" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(250, 95)">
    <text x="0" y="25" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1">
      OptiVendor<tspan fill="url(#optiGrad)">.AI</tspan>
    </text>
    <text x="5" y="65" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-weight="500" font-size="16" fill="#94A3B8" letter-spacing="3.5">
      AUTONOMOUS RFQ &amp; DECISION ENGINE
    </text>
  </g>

  <g transform="translate(630, 45)">
    <rect width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
    <circle cx="22" cy="16" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">AGENT ACTIVE</text>
  </g>
</svg>
